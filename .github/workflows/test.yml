name: bin/ci

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ "**" ]

permissions:
  contents: read

concurrency:
  group: php-tests-${{ github.ref }}
  cancel-in-progress: true

jobs:
  tests:
    name: PHP ${{ matrix.php }} • bin/ci
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        php: ['8.4', '8.5']

    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          persist-credentials: false

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          coverage: xdebug
          tools: composer:v2

      # setup-php appends ini-values to conf.d/99-pecl.ini; keep them in a
      # file of our own so no later cleanup can drop them.
      - name: Pin project php.ini values
        run: |
          printf 'memory_limit=2G\nzend.assertions=1\nxdebug.mode=off\n' \
            | sudo tee /etc/php/${{ matrix.php }}/cli/conf.d/99-zz-project.ini
          php -v
          php -i | grep -E "^(zend.assertions|xdebug.mode|memory_limit) "

      - name: Get Composer cache directory
        id: composer-cache
        run: echo "dir=$(composer config cache-files-dir)" >> "$GITHUB_OUTPUT"

      - name: Cache Composer
        uses: actions/cache@v5
        with:
          path: ${{ steps.composer-cache.outputs.dir }}
          key: ${{ runner.os }}-composer-${{ hashFiles('**/composer.lock') }}
          restore-keys: |
            ${{ runner.os }}-composer-

      - name: Install dependencies (with dev)
        run: composer install --no-interaction --prefer-dist --ansi

      - name: Run quality + tests
        run: bin/ci

  lowest-deps:
    name: PHP ${{ matrix.php }} • lowest production deps
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        php: ['8.4']

    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          persist-credentials: false

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          coverage: none
          tools: composer:v2

      - name: Pin project php.ini values
        run: |
          printf 'memory_limit=2G\nzend.assertions=1\n' \
            | sudo tee /etc/php/${{ matrix.php }}/cli/conf.d/99-zz-project.ini
          php -v

      - name: Get Composer cache directory
        id: composer-cache
        run: echo "dir=$(composer config cache-files-dir)" >> "$GITHUB_OUTPUT"

      - name: Cache Composer
        uses: actions/cache@v5
        with:
          path: ${{ steps.composer-cache.outputs.dir }}
          key: ${{ runner.os }}-composer-lowest-${{ hashFiles('**/composer.lock') }}
          restore-keys: |
            ${{ runner.os }}-composer-lowest-
            ${{ runner.os }}-composer-

      - name: Install dependencies (locked)
        run: composer install --no-interaction --prefer-dist --ansi

      - name: Downgrade production dependencies to lowest versions
        run: |
          PACKAGES=$(php -r '$j = json_decode(file_get_contents("composer.json"), true); foreach (array_keys($j["require"]) as $p) { if ($p !== "php" && !str_starts_with($p, "ext-")) { echo $p, " "; } }')
          composer update --prefer-lowest --prefer-stable --with-all-dependencies --no-interaction --prefer-dist --ansi $PACKAGES

      - name: Show resolved production versions
        run: composer show --direct --no-dev

      # The analysers see the lower bounds' signatures and types, which the
      # tests alone cannot prove the code still matches.
      - name: Run PHPStan against lowest versions
        run: composer phpstan

      - name: Run Psalm against lowest versions
        run: composer psalm

      - name: Run PHPUnit against lowest versions
        run: composer phpunit
